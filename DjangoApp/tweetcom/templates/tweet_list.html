{% extends "layout.html" %} {% block title %} Tweet App {% endblock %} 
{% block content %}

<h1 class="text-center mt-2">TweetCom</h1>
<a class="btn btn-primary mb-3" href="{% url 'tweet_create' %}">Create Tweet</a>
<div class="container row gap-3">
  {% for tweet in tweets %}
  <div class="card" style="width: 18rem">
    <img src="{{tweet.photo.url}}" class="object-fit-cover border rounded mt-2" alt="Sample Image" />
    <div class="card-body">
        <h5 class="card-title">{{ tweet.user.username }} :</h5>
        <p class="card-text"></p>
        <p class="card-text">
            {{ tweet.content }}
        </p>
    </div class="card-body">
    {% if tweet.user == user %}
      <a href="{% url 'tweet_edit' tweet.id %}" class="btn btn-primary mb-3">Edit</a>
      <a href="{% url 'tweet_delete' tweet.id %}" class="btn btn-danger mb-3">Delete</a>
    {% endif %}
  </div>
  {% endfor %}
{% endblock %}
