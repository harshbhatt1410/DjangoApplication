{% extends "layout.html" %}

{% block title %}
    Tweet App
{% endblock %}

{% block content %}
    <h1 class="text-center mt-2">TweetCom</h1>
    <h2>
        {% if form.instance.id %}
            Edit Tweet :
        {% else %}
            Create Tweet :
        {% endif %}
    </h2>
    <form method="post" enctype="multipart/form-data" class = "forms">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning ">Save Tweet</button>
        <a href="{% url 'tweet_list' %}" class="btn btn-secondary ">Cancel</a>
    </form>
    
{% endblock %}
